# CodeRabbit configuration
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
# Schema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Transcripts are generated session logs, not hand-written code.
  path_filters:
    - '!transcripts/**'

  path_instructions:
    - path: '**/*.md'
      instructions: >-
        Review prose for clarity and accuracy. Do not flag style preferences
        such as line length or heading capitalization.
    - path: 'docs/PLAN.md'
      instructions: >-
        This is a living build plan. Flag internal contradictions or steps that
        conflict with the code, not incompleteness.

  tools:
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
