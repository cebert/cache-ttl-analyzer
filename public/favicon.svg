<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="cacheanalyzer">
  <!--
    The brand mark at favicon size: the same clock ClockIcon draws in the
    sidebar, on the app's primary blue (#2563EB). Drawn on a filled tile
    rather than as a bare outline because a 16px stroke-only glyph
    disappears against a browser tab strip.

    The hands point at 5 past 1 — the two TTLs the tool chooses between.
  -->
  <rect width="32" height="32" rx="7.5" fill="#2563EB"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="9"/>
    <path d="M16 10.4V16l4 2.5"/>
  </g>
</svg>
